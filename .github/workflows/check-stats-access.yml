name: Check Stats Access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check aggregate statistics with the existing token
        env:
          GH_TOKEN: ${{ secrets.PROFILE_LANGUAGES_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$PROFILE_OWNER" -f query='
          query($login: String!) {
            viewer { login }
            user(login: $login) {
              pullRequests(first:1) { totalCount }
              issues(first:1) { totalCount }
              repositoriesContributedTo(first:1, includeUserRepositories:true,
                contributionTypes:[COMMIT,ISSUE,PULL_REQUEST,REPOSITORY]) { totalCount }
              repositories(first:100,ownerAffiliations:[OWNER],isFork:false) {
                nodes { isPrivate stargazerCount }
                pageInfo { hasNextPage }
              }
              contributionsCollection {
                contributionYears
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                restrictedContributionsCount
                contributionCalendar { totalContributions }
              }
            }
          }' --jq '{viewer:.data.viewer.login,prs:.data.user.pullRequests.totalCount,issues:.data.user.issues.totalCount,contributedTo:.data.user.repositoriesContributedTo.totalCount,stars:([.data.user.repositories.nodes[].stargazerCount]|add),privateCount:([.data.user.repositories.nodes[]|select(.isPrivate)]|length),hasMoreRepos:.data.user.repositories.pageInfo.hasNextPage,contributions:.data.user.contributionsCollection}'
